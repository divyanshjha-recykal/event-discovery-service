# Opportunity Radar — local stack. Docker Compose only, no cloud hosting this phase.
#
# MongoDB only: every collection the pipelines read and write. Starts with Docker.
# Tracing (Langfuse) is a separate, on-demand stack in docker-compose.langfuse.yml.
#
# Credentials come from .env (see .env.example). Bound to 127.0.0.1.

services:
  mongodb:
    image: docker.io/mongo:7
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-radar}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-radar}
      MONGO_INITDB_DATABASE: ${MONGO_DB_NAME:-opportunity_radar}
    ports:
      - 127.0.0.1:27017:27017
    volumes:
      - radar_mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  radar_mongo_data:
    driver: local
